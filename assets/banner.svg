<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d18;border-radius:14px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,0.45);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-pulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Glow Lines -->
    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.85; }
        50% { transform: translateY(-8px) scale(1.02); opacity: 1; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 5px; opacity: 0.6; }
        50% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes scanBeam {
        0% { transform: translateX(-150px); opacity: 0; }
        40% { opacity: 0.45; }
        100% { transform: translateX(1300px); opacity: 0; }
      }
      .circuit-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 20s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 6 10;
        animation: dashFlow 12s linear infinite reverse;
      }
      .node-pulse-1 { animation: nodeGlow 3s ease-in-out infinite; }
      .node-pulse-2 { animation: nodeGlow 4s ease-in-out infinite 1s; }
      .node-pulse-3 { animation: nodeGlow 3.5s ease-in-out infinite 2s; }
      .card-float { animation: floatPulse 6s ease-in-out infinite; }
      .scanner { animation: scanBeam 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Geometric Grid Pattern (Subtle Ambient) -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="4 8" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 8" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 8" />
    <line x1="150" y1="0" x2="150" y2="360" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="360" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke-dasharray="4 8" />
  </g>

  <!-- Dynamic Data Stream Circuit Paths in Background (Lower Layer) -->
  <g fill="none" opacity="0.38">
    <path class="circuit-line" d="M -50 90 Q 250 140 500 80 T 1000 110 T 1250 80" stroke="#38bdf8" stroke-width="2" />
    <path class="circuit-line-fast" d="M -50 270 Q 300 210 600 280 T 1100 240 T 1250 270" stroke="#a855f7" stroke-width="2" />
    <path class="circuit-line" d="M 80 -20 C 150 120 180 220 220 380" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 8" />
    <path class="circuit-line-fast" d="M 980 -20 C 1020 120 1060 250 1120 380" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 8" />
  </g>

  <!-- Dynamic Pulsing Connection Nodes (Away from text centers) -->
  <circle cx="210" cy="95" r="5" fill="#38bdf8" class="node-pulse-1" />
  <circle cx="990" cy="110" r="5" fill="#a855f7" class="node-pulse-2" />
  <circle cx="600" cy="280" r="5" fill="#06b6d4" class="node-pulse-3" />
  <circle cx="1090" cy="250" r="5" fill="#f43f5e" class="node-pulse-1" />
  <circle cx="120" cy="280" r="5" fill="#3b82f6" class="node-pulse-2" />

  <!-- Sweeping Ambient Light Beam Across Top -->
  <polygon class="scanner" points="0,0 80,0 160,360 80,360" fill="url(#primary-glow)" opacity="0.08" />

  <!-- Decorative Modern Badges / Chips (Framing sides, keeping middle clean) -->
  <g class="card-float">
    <!-- Left Pill: Event-Driven FaaS -->
    <rect x="50" y="42" width="180" height="34" rx="17" fill="url(#pill-bg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="68" cy="59" r="4.5" fill="#38bdf8" />
    <text x="82" y="64" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">⚡ EVENT-DRIVEN FaaS</text>

    <!-- Right Pill: Enterprise API Mesh -->
    <rect x="960" y="42" width="190" height="34" rx="17" fill="url(#pill-bg)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <circle cx="978" cy="59" r="4.5" fill="#c084fc" />
    <text x="992" y="64" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">🌐 SERVERLESS EDGE</text>
  </g>

  <!-- FOREGROUND: High Contrast, Sharp Title & Subtitles -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">🚀 AWESOME CURATED ARCHITECTURE</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 142)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0 3px 12px rgba(0,0,0,0.85))">
      External API Integration &amp; Functions
    </text>
  </g>

  <!-- Gradient Sub-Accent Banner -->
  <g transform="translate(600, 182)" text-anchor="middle">
    <text x="0" y="0" fill="url(#primary-glow)" font-size="18" font-weight="700" letter-spacing="1.5">
      SERVERLESS COMPUTE • CLOUD FUNCTIONS • FaaS • WORKFLOW ORCHESTRATION
    </text>
  </g>

  <!-- Concise Description Line -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="400">
      Comprehensive Directory of Enterprise Cloud SaaS Platforms &amp; Open-Source Self-Hosted Engines
    </text>
  </g>

  <!-- Bottom Interactive-Looking Metadata Badges -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <!-- Badge 1: Cloud Hyperscalers -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#131c2e" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="600">☁️ Cloud Hyperscalers</text>
    </g>

    <!-- Badge 2: Global Edge Runtimes -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#131c2e" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="5" fill="#818cf8" font-size="12" font-weight="600">🌍 Edge Computing</text>
    </g>

    <!-- Badge 3: Kubernetes FaaS -->
    <g transform="translate(105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#131c2e" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="5" fill="#a855f7" font-size="12" font-weight="600">☸️ Kubernetes Native</text>
    </g>

    <!-- Badge 4: Production Open Source -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#131c2e" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="5" fill="#34d399" font-size="12" font-weight="600">🔓 Open-Source FaaS</text>
    </g>
  </g>
</svg>